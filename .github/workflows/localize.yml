name: Localize i3 static site

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/localize.yml
      - tools/localize.py
      - tools/resources.zlib.b64

permissions:
  contents: write

concurrency:
  group: localize-i3
  cancel-in-progress: false

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HTML parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3

      - name: Fetch and localize cloned assets
        run: python tools/localize.py

      - name: Verify no external runtime resources
        run: python tools/localize.py --verify-only

      - name: Commit localized site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Localize i3 site assets and block external resources"
            git push origin HEAD:main
          fi
